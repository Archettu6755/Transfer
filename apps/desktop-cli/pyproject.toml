[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "desktop-cli"
version = "0.1.0"
description = "Local CLI scaffold for the browser-live-translator desktop product."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx",
  "PySide6",
  "sounddevice",
]

[project.scripts]
desktop-cli = "desktop_cli.cli.main:main"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_cli"]
